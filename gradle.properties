org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8
# Four Loom instances get configured in a single build, so 1G is not enough.
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false
org.gradle.cache.cleanup=false

# Tooling
# Used by dev.kikugie.loom-back-compat, which picks net.fabricmc.fabric-loom-remap
# for obfuscated Minecraft (<26) and net.fabricmc.fabric-loom for the rest.
loomx.loom_version=1.17.21

# Loader is version-agnostic, so it is shared by every version.
# 0.19.5 is the floor: malilib and fabric-api builds for the supported versions need it.
loader_version=0.19.5

# Mod properties (version-agnostic).
mod_id=milkytools
mod_name=Milkytools
mod_version=1.4.0
mod_group=com.milky
mod_archives_base_name=milkytools

# Per-version values (minecraft_dependency, fabric_api_version, malilib_version,
# modmenu_version) live in versions/<minecraft version>/gradle.properties.
